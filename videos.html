<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Videos | Thee Adversary</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #101219;
        color: #ef537e;
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: auto;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
      section {
        padding: 1.4rem 1rem 2rem;
        text-align: center;
      }
      h1,
      h2 {
        margin: 0.65rem 0;
        font-size: 1.2rem;
      }
      h1 {
        font-size: 1.65rem;
      }
      nav {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-bottom: 1.35rem;
      }
      a {
        color: #ef537e;
        padding: 0.55rem 0.9rem;
        text-decoration: none;
      }
      a:hover {
        color: #ef537e;
      }
      a:focus-visible {
        outline: 1px dashed #ef537e;
        outline-offset: 3px;
      }
      footer {
        color: #e5b8c8;
        font-size: 0.875rem;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
        gap: 0.75rem;
        align-items: start;
      }
      .gallery a {
        display: block;
        padding: 0;
        overflow: hidden;
      }
      .gallery img {
        width: 100%;
        height: auto;
      }
      .poster {
        position: relative;
      }
      .poster-map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .poster-map a {
        pointer-events: all;
        fill: transparent;
        -webkit-tap-highlight-color: transparent;
      }
      .poster-map a:focus-visible {
        outline: none;
        filter: drop-shadow(0 0 2px #ef537e);
        stroke: #ef537e;
        stroke-width: 1;
      }
      .poster-menu {
        margin: 0;
        padding: 0.65rem;
        border-bottom: 1px solid #69364a;
        gap: 0.5rem 1.5rem;
      }
      .poster-menu a {
        border: 0;
        padding: 0.3rem 0.5rem;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      section[hidden] {
        display: none;
      }
      h1,
      h2 {
        scroll-margin-top: 1rem;
      }
      .artist-credit {
        text-align: center;
        padding: 1rem 1rem 1.5rem;
      }
      .artist-credit img {
        width: min(290px, 80%);
        margin: 0.35rem auto 0;
      }
      body {
        background:
          radial-gradient(ellipse at 75% 35%, #362431 0%, transparent 58%),
          linear-gradient(145deg, #182d36, #201923);
        font-family: system-ui, sans-serif;
      }
      .poster-menu {
        border: 0;
        padding: 0.45rem;
      }
      .poster-menu a {
        font-size: 0.87rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .poster-menu a:hover {
        background: transparent;
        text-decoration: underline;
        color: #ef537e;
      }
      .poster-map a {
        cursor: pointer;
      }
      .artist-credit {
        padding: 0.1rem 1rem 0.7rem;
      }
      .artist-credit img {
        width: min(230px, 70%);
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main > section h1,
      main > section h2,
      main > section nav a {
        font-weight: 400;
      }
      .artist-credit {
        margin-top: auto;
        padding: 1rem 1rem 0.6rem;
      }
      .artist-credit img {
        width: min(145px, 60%);
        margin: 0 auto;
      }
      body {
        background: #000;
        isolation: isolate;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: url("studio-collage-background.png") left bottom/cover
          no-repeat;
      }
      main > section {
        scroll-margin-top: 1rem;
      }
      @med@media (max-aspect-ratio: 7/8) {
        body::before {
          background-size: cover;
          background-position: center bottom;
        }
      }
      ia (max-aspect-ratio: 7/8) {
        body::before {
          background-size: contain;
        }
      }
      @media (min-height: 320px) {
        html:has(main > section):not(:has(main > section:not([hidden]))) {
          overflow-y: hidden;
        }
        main:not(:has(> section:not([hidden]))) > .poster {
          width: min(100%, calc((100svh - 120px) * 4 / 3));
          margin-inline: auto;
        }
      }
      .poster-menu a {
        font-weight: 500;
      }
      .poster > img {
        mask:
          linear-gradient(to bottom, transparent 6px, #000 29px),
          linear-gradient(
            to right,
            transparent 71%,
            #000 74%,
            #000 88%,
            transparent 91%
          ),
          linear-gradient(
              to right,
              transparent 53%,
              #000 57%,
              #000 68%,
              transparent 72%
            )
            center 1.5%/100% 10% no-repeat;
      }
      .artist-credit {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
      }
      .artist-credit img {
        margin: 0;
      }
      .poster-map a {
        position: absolute;
        padding: 0;
        cursor: pointer;
        background: transparent;
      }
      .poster-map a:focus-visible {
        outline: 1px dashed #ef537e;
        outline-offset: -2px;
        filter: none;
      }
      .video-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        max-width: 960px;
        margin: auto;
      }
      .video-grid video {
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
      }
      @media (max-width: 600px) {
        .video-grid {
          grid-template-columns: 1fr;
        }
      }
      .poster-map a::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: var(--reveal) center var(--crop, 35%) / cover no-repeat;
        mask-image: radial-gradient(
          ellipse at center,
          #000 38%,
          transparent 76%
        );
        transition: opacity 0.24s ease;
      }
      .poster-map a:nth-child(1) {
        --reveal: url("reveals/1.jpg");
        --crop: 9%;
      }
      .poster-map a:nth-child(2) {
        --reveal: url("reveals/2.jpg");
      }
      .poster-map a:nth-child(3) {
        --reveal: url("reveals/3.jpg");
      }
      .poster-map a:nth-child(4) {
        --reveal: url("reveals/4.jpg");
        --crop: 25%;
      }
      .poster-map a:nth-child(5) {
        --reveal: url("reveals/5.jpg");
        --crop: 60%;
      }
      .poster-map a:nth-child(6) {
        --reveal: url("reveals/6.jpg");
        --crop: 24%;
      }
      @media (hover: hover) {
        .poster-map a:hover {
          z-index: 1;
        }
        .poster-map a:hover::after {
          opacity: 1;
        }
      }
      .poster-map a:focus-visible::after {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .poster-map a::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="poster">
        <img
          src="artwork.png"
          width="1440"
          height="1080"
          alt="Thee Adversary collage with a skull-faced figure in a black hat and pink lettering"
        />
        <div class="poster-map" aria-label="Links on the artwork">
          <a
            href="https://www.facebook.com/theeoffering"
            aria-label="Thee Adversary on Facebook"
            style="left: 0%; top: 56%; width: 66%; height: 44%"
          ></a
          ><a
            href="https://www.facebook.com/madarabstudio"
            aria-label="Mad Arab Studio on Facebook"
            style="left: 78%; top: 87%; width: 22%; height: 13%"
          ></a
          ><a
            href="https://www.youtube.com/@MadArabStudio"
            aria-label="Mad Arab Studio on YouTube"
            style="left: 55%; top: 64%; width: 24%; height: 31%"
          ></a
          ><a
            href="https://www.youtube.com/@theeadversaryband"
            aria-label="Thee Adversary on YouTube"
            style="left: 57%; top: 32%; width: 20%; height: 26%"
          ></a
          ><a
            href="https://instagram.com/thee.adversary"
            aria-label="Thee Adversary on Instagram"
            style="left: 46%; top: 50%; width: 12%; height: 19%"
          ></a
          ><a
            href="https://instagram.com/madarabstudio"
            aria-label="Mad Arab Studio on Instagram"
            style="left: 73%; top: 0; width: 17%; height: 23%"
          ></a>
        </div>
      </div>
      <nav class="poster-menu" aria-label="Explore the site">
        <a href="index.html">Home</a><a href="index.html#photos">Photos</a
        ><a href="index.html#flyers">Flyers</a
        ><a href="videos.html" aria-current="page">Videos</a
        ><a href="index.html#contact">Contact</a>
      </nav>
      <section aria-label="Thee Adversary live videos">
        <div class="video-grid">
          <video
            controls
            playsinline
            preload="metadata"
            aria-label="Thee Adversary live promo clip 010"
          >
            <source src="clips/010.mp4" type="video/mp4" />
          </video>
          <video
            controls
            playsinline
            preload="metadata"
            aria-label="Thee Adversary live promo clip 020"
          >
            <source src="clips/020.mp4" type="video/mp4" />
          </video>
          <video
            controls
            playsinline
            preload="metadata"
            aria-label="Thee Adversary live promo clip 030"
          >
            <source src="clips/030.mp4" type="video/mp4" />
          </video>
          <video
            controls
            playsinline
            preload="metadata"
            aria-label="Thee Adversary live promo clip 040"
          >
            <source src="clips/040.mp4" type="video/mp4" />
          </video>
        </div>
      </section>
      <div class="artist-credit">
        <img src="artist-sigil-red.png" alt="Aniamachina Art" />
      </div>
    </main>
  </body>
</html>
